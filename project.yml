name: Hourglass
options:
  bundleIdPrefix: com.satyajit
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Apple-Silicon-only product (see CLAUDE.md: "The app floor is macOS 15,
    # Apple Silicon (arm64)"). Pin ARCHS to arm64 so xcodebuild does NOT also
    # try to produce an x86_64 slice. This is required now that we vendor the
    # arm64-only `cactus-macos.xcframework` (the Cactus on-device LLM engine):
    # an x86_64 link leg has no Cactus binary to link against and fails. It is
    # also correct on the merits — we never shipped a working Intel build and
    # the whole stack (MLX/Metal, Cactus) targets Apple Silicon. Drop or widen
    # this only if an Intel target is ever genuinely needed.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "2.2.0"
  # Sparkle 2.x — in-process app updates. Ships as a binary xcframework via
  # SPM; the `sign_update` / `generate_keys` CLIs live inside the resolved
  # artifact under `SourcePackages/artifacts/sparkle/Sparkle/bin/` (look
  # there from scripts/package.sh). The framework itself is what we link;
  # the appcast is a static XML file we host separately (see plans.md
  # 2026-05-26 build-agent entry for the placeholder URL + key + how to
  # fill them in).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.9.2"

targets:
  Hourglass:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    # XcodeGen-managed Info.plist. We need this (rather than the cheaper
    # GENERATE_INFOPLIST_FILE auto-plist) because Sparkle's `SU*` keys
    # aren't in Xcode's `INFOPLIST_KEY_*` curated mapping — they get
    # silently dropped. With `info:`, XcodeGen writes a real file we fully
    # control.
    #
    # The path is `Resources/Hourglass.Info.plist`. It's tracked in git so
    # CI builds don't need XcodeGen. Re-run `./scripts/generate.sh` after
    # changing any property below and the file will be rewritten.
    info:
      path: Resources/Hourglass.Info.plist
      properties:
        # ----- Standard bundle metadata (mirrors what GENERATE_INFOPLIST_FILE
        # used to synthesize). The CF/LS values are constants; the
        # version/build numbers reference build-setting macros so a single
        # bump in `settings.base.MARKETING_VERSION` flows through. -----
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Hourglass
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Satyajit Amme. All rights reserved."
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        # ----- Sparkle (in-process app updates) ---------------------------
        # PLACEHOLDERS — replace before first public release. See plans.md
        # 2026-05-26 build-agent entry for the full fill-in checklist.
        #   SUFeedURL: the static appcast XML the updater polls. Must be
        #     HTTPS (Sparkle 2 rejects plain http). We don't host it yet.
        #   SUPublicEDKey: base64 EdDSA public key, output by
        #     `bin/generate_keys`. Pair the corresponding PRIVATE key with
        #     `scripts/package.sh` via `SPARKLE_PRIVATE_KEY=…` env var.
        #     NEVER COMMIT THE PRIVATE KEY.
        #   SUEnableAutomaticChecks: true means Sparkle may check on its own
        #     once the user has opted in (first run shows a permission
        #     dialog). Set to false to require explicit menu-driven checks.
        #   SUEnableInstallerLauncherService: only relevant when the app is
        #     sandboxed (it gates the XPC launcher). Hourglass is
        #     unsandboxed (chat.db needs FDA — see Hourglass.entitlements),
        #     so this is false. Left declared for clarity + future-proofing.
        SUFeedURL: "https://ammesatyajit.github.io/hourglass/appcast.xml"
        SUPublicEDKey: "B++G1ipP8FLfOtD8wC92uXMrZx+L9j5EHPGp5upUxD8="
        SUEnableAutomaticChecks: true
        SUEnableInstallerLauncherService: false
    sources:
      - path: Sources
        excludes:
          - NL/MLXRuntime.swift
          - NL/ModelDownloader.swift
          - NL/NLModelPreference.swift
      - path: Resources/Assets.xcassets
    dependencies:
      - package: GRDB
        product: GRDB
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      # In-process update checker. The framework is binary (xcframework via
      # SPM); the menu-bar "Check for Updates…" item is wired in
      # `Sources/HourglassApp.swift::MenuBarContent` and the
      # `SPUStandardUpdaterController` is constructed in
      # `Sources/Panel/AppDelegate.swift`. See plans.md 2026-05-26 for the
      # placeholder appcast URL + public EdDSA key + sign_update flow.
      - package: Sparkle
        product: Sparkle
      # ----- Needle2 function-calling engine (production default) -------
      # Official cactus-needle 2.0.2 arm64 dylib from the macOS 11 wheel.
      # Unlike the standalone release archive (whose objects declare macOS
      # 26), this engine declares LC_BUILD_VERSION minos 11.0 and therefore
      # covers Hourglass's macOS 15 deployment target. Its install name is
      # @rpath/libneedle.dylib, so it must be embedded and signed with the app.
      # Full provenance and checksum: Vendor/Needle2/PROVENANCE.md.
      - framework: Vendor/Needle2/macos-arm64/libneedle.dylib
        embed: true
        codeSign: true
      # ----- Cactus on-device LLM engine (OPT-IN, default OFF) -----------
      # Vendored macOS (arm64) xcframework built from the local cactus repo
      # at the **v1.14 release commit (40a7123b)** — the last release whose
      # engine loads the flat CQ weights on disk directly (current cactus
      # main is v2.0 and requires `cactus convert` transpiled bundles, which
      # we don't have). The v2.0 build remains vendored side-by-side at
      # `Vendor/cactus-macos.xcframework` for when transpiled models exist;
      # both expose the same `cactus` module + identical FFI, so only ONE can
      # be linked at a time. Built via a macos-only variant of apple/build.sh
      # (see plans.md 2026-06-09 build-agent entry).
      #
      # It is a DYNAMIC framework (`com.cactuscompute.cactus`, install_name
      # `@rpath/cactus.framework/...`), so it MUST be embedded AND signed
      # consistently with the app or dyld SIGABRTs at launch on a Team-ID
      # mismatch — the same failure mode we hit historically with Sparkle.
      # scripts/build.sh's post-build `codesign --force --deep` re-signs the
      # embedded framework with the app's stable identity, satisfying that.
      #
      # The framework exposes the `cactus` clang module (umbrella header
      # `cactus_ffi.h` + an injected `Modules/module.modulemap`), imported
      # by `Sources/NL/CactusRuntime.swift` as `import cactus`. Linking is
      # weak/opt-in at the *runtime* level: CactusRuntime only loads a model
      # when `defaults write com.satyajit.hourglass nl.runtime.cactus -bool
      # true` is set; the default AI Search runtime stays Needle2.
      - framework: Vendor/cactus-v114-macos.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        # Needle2 is a 14 MB arm64 dylib with the base weights baked in. It
        # replaces the downloaded/resident Qwen model for AI Search. Linking
        # and embedding are owned by the dependency above; this path exposes
        # the C header as the `Needle2` Clang module imported from Swift.
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/Vendor/Needle2"
        # XcodeGen emits `-lneedle` for a raw dylib dependency but does not
        # infer its containing directory as an `-L` search path.
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/Needle2/macos-arm64"
        # Bundle id is `com.satyajit.hourglass` — the project's canonical
        # identity. macOS TCC keys Full Disk Access grants on this value, so
        # don't change it after the first public release without expecting
        # every user to re-grant FDA.
        PRODUCT_BUNDLE_IDENTIFIER: com.satyajit.hourglass
        PRODUCT_NAME: Hourglass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # We OWN the Info.plist via XcodeGen's `info:` block below (so we
        # can declare Sparkle's `SU*` keys, which Xcode's INFOPLIST_KEY_*
        # auto-merger refuses to forward — it only knows Apple-curated
        # keys). `info.path` points to a generated file under Resources/.
        # Don't toggle GENERATE_INFOPLIST_FILE back on without removing
        # `info:` — Xcode would error on the duplicate Info.plist source.
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc inside Xcode so the build itself never blocks on
        # provisioning profiles. A POST-BUILD step in scripts/build.sh
        # re-signs the produced .app with a stable identity (Apple
        # Development cert if present, self-signed fallback if not) so
        # macOS TCC keeps the Full Disk Access grant across rebuilds.
        # This was a real DX bug — every rebuild made a fresh CDHash,
        # so TCC treated every binary as a brand-new app.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Resources/Hourglass.entitlements
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
        COMBINE_HIDPI_IMAGES: YES

  HourglassTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
        excludes:
          - MLXBenchmarkTests.swift
          - MLXRuntimeTests.swift
    dependencies:
      - target: Hourglass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satyajit.hourglass.tests
        GENERATE_INFOPLIST_FILE: YES
        # `@testable import Hourglass` loads Hourglass's Swift module, whose
        # Needle2 runtime has a private Clang-module dependency.
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/Vendor/Needle2"

schemes:
  Hourglass:
    build:
      targets:
        Hourglass: all
        HourglassTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HourglassTests
    archive:
      config: Release
