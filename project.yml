name: Hourglass
options:
  bundleIdPrefix: com.satyajit
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "2.2.0"
  # Apple's MLX Swift LM. Provides the local LLM runtime for the NL search
  # bar (Phase 2). MLXLLM = decoder-only models, MLXLMCommon = ChatSession +
  # ModelContainer + tokenizer plumbing, MLXHuggingFace = first-run
  # downloader + the `#huggingFaceLoadModelContainer` macro. We do NOT take
  # MLXVLM / MLXEmbedders — the LLM bits alone keep our binary small.
  # Min macOS = 14 per the package's Package.swift; we target 26, so no
  # compatibility risk.
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    from: "3.31.3"
  # `MLXHuggingFace`'s `#huggingFaceLoadModelContainer` macro expands to
  # code that references `HuggingFace.HubClient` and `Tokenizers.AutoTokenizer`.
  # Those types live in two sibling Hugging Face Swift packages — they're
  # NOT bundled with mlx-swift-lm itself. The call-site has to import
  # `HuggingFace` and `Tokenizers` (and link the modules) for the macro
  # expansion to compile.
  #
  # `swift-huggingface` provides the `HuggingFace` library (the Hub client
  # — networking, snapshot download, resume).
  # `swift-transformers` provides the `Tokenizers` library (BPE / WordPiece
  # / chat templates / fast tokenization for HF models).
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface.git
    from: "0.9.0"
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: "1.3.3"
  # Sparkle 2.x — in-process app updates. Ships as a binary xcframework via
  # SPM; the `sign_update` / `generate_keys` CLIs live inside the resolved
  # artifact under `SourcePackages/artifacts/sparkle/Sparkle/bin/` (look
  # there from scripts/package.sh). The framework itself is what we link;
  # the appcast is a static XML file we host separately (see plans.md
  # 2026-05-26 build-agent entry for the placeholder URL + key + how to
  # fill them in).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.9.2"

targets:
  Hourglass:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    # XcodeGen-managed Info.plist. We need this (rather than the cheaper
    # GENERATE_INFOPLIST_FILE auto-plist) because Sparkle's `SU*` keys
    # aren't in Xcode's `INFOPLIST_KEY_*` curated mapping — they get
    # silently dropped. With `info:`, XcodeGen writes a real file we fully
    # control.
    #
    # The path is `Resources/Hourglass.Info.plist`. It's tracked in git so
    # CI builds don't need XcodeGen. Re-run `./scripts/generate.sh` after
    # changing any property below and the file will be rewritten.
    info:
      path: Resources/Hourglass.Info.plist
      properties:
        # ----- Standard bundle metadata (mirrors what GENERATE_INFOPLIST_FILE
        # used to synthesize). The CF/LS values are constants; the
        # version/build numbers reference build-setting macros so a single
        # bump in `settings.base.MARKETING_VERSION` flows through. -----
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Hourglass
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Satyajit Amme. All rights reserved."
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        # ----- Sparkle (in-process app updates) ---------------------------
        # PLACEHOLDERS — replace before first public release. See plans.md
        # 2026-05-26 build-agent entry for the full fill-in checklist.
        #   SUFeedURL: the static appcast XML the updater polls. Must be
        #     HTTPS (Sparkle 2 rejects plain http). We don't host it yet.
        #   SUPublicEDKey: base64 EdDSA public key, output by
        #     `bin/generate_keys`. Pair the corresponding PRIVATE key with
        #     `scripts/package.sh` via `SPARKLE_PRIVATE_KEY=…` env var.
        #     NEVER COMMIT THE PRIVATE KEY.
        #   SUEnableAutomaticChecks: true means Sparkle may check on its own
        #     once the user has opted in (first run shows a permission
        #     dialog). Set to false to require explicit menu-driven checks.
        #   SUEnableInstallerLauncherService: only relevant when the app is
        #     sandboxed (it gates the XPC launcher). Hourglass is
        #     unsandboxed (chat.db needs FDA — see Hourglass.entitlements),
        #     so this is false. Left declared for clarity + future-proofing.
        SUFeedURL: "https://ammesatyajit.github.io/hourglass/appcast.xml"
        SUPublicEDKey: "B++G1ipP8FLfOtD8wC92uXMrZx+L9j5EHPGp5upUxD8="
        SUEnableAutomaticChecks: true
        SUEnableInstallerLauncherService: false
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: GRDB
        product: GRDB
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      # Required by MLXHuggingFace's macro expansion (see packages: above).
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      # In-process update checker. The framework is binary (xcframework via
      # SPM); the menu-bar "Check for Updates…" item is wired in
      # `Sources/HourglassApp.swift::MenuBarContent` and the
      # `SPUStandardUpdaterController` is constructed in
      # `Sources/Panel/AppDelegate.swift`. See plans.md 2026-05-26 for the
      # placeholder appcast URL + public EdDSA key + sign_update flow.
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        # Bundle id is `com.satyajit.hourglass` — the project's canonical
        # identity. macOS TCC keys Full Disk Access grants on this value, so
        # don't change it after the first public release without expecting
        # every user to re-grant FDA.
        PRODUCT_BUNDLE_IDENTIFIER: com.satyajit.hourglass
        PRODUCT_NAME: Hourglass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # We OWN the Info.plist via XcodeGen's `info:` block below (so we
        # can declare Sparkle's `SU*` keys, which Xcode's INFOPLIST_KEY_*
        # auto-merger refuses to forward — it only knows Apple-curated
        # keys). `info.path` points to a generated file under Resources/.
        # Don't toggle GENERATE_INFOPLIST_FILE back on without removing
        # `info:` — Xcode would error on the duplicate Info.plist source.
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc inside Xcode so the build itself never blocks on
        # provisioning profiles. A POST-BUILD step in scripts/build.sh
        # re-signs the produced .app with a stable identity (Apple
        # Development cert if present, self-signed fallback if not) so
        # macOS TCC keeps the Full Disk Access grant across rebuilds.
        # This was a real DX bug — every rebuild made a fresh CDHash,
        # so TCC treated every binary as a brand-new app.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Resources/Hourglass.entitlements
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
        COMBINE_HIDPI_IMAGES: YES

  HourglassTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
    dependencies:
      - target: Hourglass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satyajit.hourglass.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Hourglass:
    build:
      targets:
        Hourglass: all
        HourglassTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HourglassTests
    archive:
      config: Release
